<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verifica tu correo - AutoScoreMX</title>
<meta name="robots" content="noindex"/>
<link href="favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="apple-touch-icon.png" rel="apple-touch-icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface": "#dbe5d9", "on-surface-variant": "#c7d6c6",
                        "outline-variant": "#3b4a3d", "on-background": "#dbe5d9",
                        "primary-container": "#00e678", "on-primary-fixed": "#00210c",
                        "background": "#0d150e", "surface-container-lowest": "#081009",
                        "surface-container-high": "#232c24",
                        "bg-level-0": "#1A1A1A", "bg-level-1": "#2A2A2A", "border-level-1": "#3A3A3A"
                    },
                    fontFamily: { sans: ["Montserrat", "sans-serif"] }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .bg-level-0 { background-color: #1A1A1A; }
        .bg-level-1 { background-color: #2A2A2A; border: 1px solid #3A3A3A; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #00e678; outline-offset: 2px; border-radius: 4px; }
        .otp-box {
            width: 100%; aspect-ratio: 1; text-align: center; font-size: 1.5rem; font-weight: 700;
            background: #151e16; border: 1px solid #3A3A3A; border-radius: 10px; color: #dbe5d9;
        }
        .otp-box:focus { border-color: #00e678; }
    </style>
</head>
<body class="bg-level-0 text-on-background font-sans min-h-screen flex flex-col">

<nav class="bg-background border-b border-outline-variant">
<div class="flex justify-between items-center w-full px-4 md:px-16 py-4 max-w-6xl mx-auto">
<a href="index.html" class="flex items-center" aria-label="AutoScore, ir al inicio">
<img src="logo.png" alt="AutoScore" class="h-8 w-auto"/>
</a>
<a href="index.html#contacto" class="text-on-surface-variant font-bold text-sm flex items-center gap-1.5 hover:text-primary-container transition-colors">
<span class="material-symbols-outlined text-lg" aria-hidden="true">help</span> ¿Necesitas ayuda?
</a>
</div>
</nav>

<main class="flex-grow flex items-center justify-center px-4 py-16">
<div class="max-w-md w-full bg-level-1 rounded-2xl p-8 flex flex-col items-center text-center gap-5">
<span class="material-symbols-outlined text-primary-container" style="font-size:2.5rem" aria-hidden="true">mark_email_unread</span>
<h1 class="text-2xl font-bold text-on-background">Verifica tu correo</h1>
<p class="text-on-surface-variant">Enviamos un código de acceso de un solo uso a <strong class="text-on-background">t***@correo.com</strong>.</p>

<form onsubmit="return handleVerificar(event)" class="w-full flex flex-col gap-6">
<div class="grid grid-cols-6 gap-2" onpaste="handlePaste(event)">
<input type="text" inputmode="numeric" maxlength="1" class="otp-box" oninput="autoAdvance(this)" required=""/>
<input type="text" inputmode="numeric" maxlength="1" class="otp-box" oninput="autoAdvance(this)" required=""/>
<input type="text" inputmode="numeric" maxlength="1" class="otp-box" oninput="autoAdvance(this)" required=""/>
<input type="text" inputmode="numeric" maxlength="1" class="otp-box" oninput="autoAdvance(this)" required=""/>
<input type="text" inputmode="numeric" maxlength="1" class="otp-box" oninput="autoAdvance(this)" required=""/>
<input type="text" inputmode="numeric" maxlength="1" class="otp-box" oninput="autoAdvance(this)" required=""/>
</div>
<button type="submit" class="w-full bg-primary-container text-on-primary-fixed font-bold py-3.5 rounded-full hover:brightness-110 transition-all flex items-center justify-center gap-2">
<span>Continuar</span> <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
</button>
</form>

<div>
<button type="button" id="reenviar-btn" onclick="reenviarCodigo()" class="font-bold text-primary-container hover:text-primary transition-colors">Reenviar código</button>
<p id="reenviar-nota" class="text-xs text-on-surface-variant mt-1">Puedes solicitar un nuevo código en <span id="countdown">30</span>s.</p>
</div>
</div>
</main>

<footer class="border-t border-outline-variant py-6 px-4 md:px-16">
<div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3 text-xs text-on-surface-variant">
<p>© 2026 AutoScoreMX. Todos los derechos reservados.</p>
<div class="flex gap-4">
<a href="terminos.html" class="hover:text-primary-container">Términos y Condiciones</a>
<a href="privacidad.html" class="hover:text-primary-container">Aviso de Privacidad</a>
<a href="#" class="hover:text-primary-container">Soporte</a>
</div>
</div>
</footer>

<script>
    function autoAdvance(input) {
        input.value = input.value.replace(/[^0-9]/g, '');
        if (input.value.length === 1 && input.nextElementSibling) {
            input.nextElementSibling.focus();
        }
    }
    function handlePaste(event) {
        const text = (event.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
        const boxes = event.currentTarget.querySelectorAll('.otp-box');
        text.split('').slice(0, 6).forEach((char, i) => { if (boxes[i]) boxes[i].value = char; });
        event.preventDefault();
    }
    function handleVerificar(event) {
        event.preventDefault();
        // Prototipo estático: no hay backend real para validar el código.
        // Por defecto navega al estado "reporte encontrado" (completado).
        window.location.href = 'reporte-encontrado.html';
        return false;
    }

    let segundos = 30;
    const reenviarBtn = document.getElementById('reenviar-btn');
    reenviarBtn.disabled = true;
    reenviarBtn.classList.add('opacity-50', 'pointer-events-none');
    const interval = setInterval(() => {
        segundos--;
        document.getElementById('countdown').textContent = segundos;
        if (segundos <= 0) {
            clearInterval(interval);
            document.getElementById('reenviar-nota').classList.add('hidden');
            reenviarBtn.disabled = false;
            reenviarBtn.classList.remove('opacity-50', 'pointer-events-none');
        }
    }, 1000);
    function reenviarCodigo() {
        segundos = 30;
        reenviarBtn.disabled = true;
        reenviarBtn.classList.add('opacity-50', 'pointer-events-none');
        document.getElementById('reenviar-nota').classList.remove('hidden');
    }
</script>
</body>
</html>
